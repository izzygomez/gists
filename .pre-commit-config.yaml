################################################################################
# See pre-commit.com for documentation.
#
# Some helpful commands:
# - `pre-commit install` to install the hooks.
# - `pre-commit run -a/--all-files [--verbose]` to run the hooks manually.
# - `git commit -n/--no-verify` to skip the hooks.
# - `pre-commit autoupdate` to update the hooks to the latest version.
# - `pre-commit clean` to clean out cached files.
# - In hooks configurations below with `files` & `exclude` options set: to
#   enumerate all files that will be processed by the hook, run:
#   `git ls-files | grep -E '{files}' | grep -v -E '{exclude}'`
#   where {files} is the regex of files to process, & {exclude} is the regex of
#   files to exclude.
################################################################################

# https://pre-commit.ci/ configuration
ci:
  autofix_prs: false # this doesn't work well with stacked PRs
  autoupdate_schedule: monthly

repos:
  # pre-commit-hooks — general file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-ast
      - id: check-builtin-literals
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-yaml
      - id: debug-statements
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: no-commit-to-branch
      - id: requirements-txt-fixer
      - id: trailing-whitespace

  # Ruff — Python linting & formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff-check # linter
        args: [--fix] # auto-fix issues when possible
      - id: ruff-format # formatter

  # shfmt — shell script formatting
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt
        args: [-w, -s, -i, "4"] # write changes, simplify code, 4-space indent

  # shellcheck — shell script linting
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  # Prettier — multi-language formatting
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: "v3.9.6"
    hooks:
      - id: prettier
